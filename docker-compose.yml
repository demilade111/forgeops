services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: forgeops
      POSTGRES_PASSWORD: forgeops
      POSTGRES_DB: forgeops
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: forgeops
      RABBITMQ_DEFAULT_PASS: forgeops
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  registry:
    image: registry:3
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - registry-data:/var/lib/registry

  registry-test:
    image: registry:3
    ports:
      - "127.0.0.1:5002:5000"
    tmpfs:
      - /var/lib/registry

  caddy:
    image: caddy:2.10
    command: caddy run --config /etc/caddy/caddy.json --resume
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:2019:2019"
    volumes:
      - ./caddy/caddy.json:/etc/caddy/caddy.json:ro
      - caddy-config:/config
    networks:
      - apps

  caddy-test:
    image: caddy:2.10
    command: caddy run --config /etc/caddy/caddy.json
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:2020:2019"
    volumes:
      - ./caddy/caddy.json:/etc/caddy/caddy.json:ro
    networks:
      - apps

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  mailpit-test:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: forgeops-api:dev
    environment:
      DATABASE_URL: postgresql://forgeops:forgeops@postgres:5432/forgeops
      RABBITMQ_URL: amqp://forgeops:forgeops@rabbitmq:5672
      SMTP_URL: smtp://mailpit:1025
      ENCRYPTION_KEY_PATH: /run/secrets/env-encryption.key
    volumes:
      - ~/.forgeops/env-encryption.key:/run/secrets/env-encryption.key:ro
    ports:
      - "127.0.0.1:4001:4000"
    depends_on:
      - postgres
      - rabbitmq

networks:
  apps:
    name: forgeops-apps

volumes:
  caddy-config:
  postgres-data:
  rabbitmq-data:
  registry-data:
