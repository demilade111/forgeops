services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: forgeops
      POSTGRES_PASSWORD: forgeops
      POSTGRES_DB: forgeops
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: forgeops
      RABBITMQ_DEFAULT_PASS: forgeops
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  postgres-data:
  rabbitmq-data:
