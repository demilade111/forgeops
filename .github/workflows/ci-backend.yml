name: ci-backend

on:
  push:
    paths:
      - "apps/api/**"
      - "caddy/**"
      - "docker-compose.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - ".nvmrc"
      - ".github/workflows/ci-backend.yml"
      - ".github/actions/**"
      - ".trivyignore.yaml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cp apps/api/.env.example apps/api/.env
      - run: docker compose up -d --wait postgres rabbitmq registry-test caddy-test mailpit-test
      - run: docker compose exec -T postgres createdb -U forgeops forgeops_test
      - run: pnpm install --frozen-lockfile --filter . --filter @forgeops/api
      - run: pnpm exec eslint apps/api
      - run: pnpm --filter @forgeops/api typecheck
      - run: pnpm --filter @forgeops/api build
      - run: pnpm --filter @forgeops/api test

  image:
    needs: backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
      SOURCE: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          for target in api worker migrate; do
            image="$REGISTRY/forgeops-$target:${{ github.sha }}"
            docker build -f apps/api/Dockerfile --target "$target" --label "org.opencontainers.image.source=$SOURCE" -t "$image" .
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache -v "$PWD/.trivyignore.yaml:/trivyignore.yaml:ro" "$TRIVY" image --ignorefile /trivyignore.yaml --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$image"
          done
      - run: |
          for target in api worker migrate; do
            docker push "$REGISTRY/forgeops-$target:${{ github.sha }}"
          done
