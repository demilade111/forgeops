name: ci-frontend

on:
  push:
    paths:
      - "apps/frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - ".nvmrc"
      - ".github/workflows/ci-frontend.yml"
      - ".github/actions/**"
      - ".trivyignore.yaml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile --filter . --filter @forgeops/frontend
      - run: pnpm exec eslint apps/frontend
      - run: pnpm --filter @forgeops/frontend typecheck
      - run: pnpm --filter @forgeops/frontend test
      - run: pnpm --filter @forgeops/frontend build

  image:
    needs: frontend
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: image-frontend
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
      IMAGE: ghcr.io/${{ github.repository_owner }}/forgeops-web:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker build -f apps/frontend/Dockerfile --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" -t "$IMAGE" .
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache -v "$PWD/.trivyignore.yaml:/trivyignore.yaml:ro" "$TRIVY" image --ignorefile /trivyignore.yaml --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$IMAGE"
      - run: docker push "$IMAGE"
